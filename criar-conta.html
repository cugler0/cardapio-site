<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta</title>
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--surface:#171112}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 15% -10%,rgba(255,74,61,.28),transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{width:100%;max-width:440px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{margin:0 0 6px;color:var(--muted)}
.preco{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.preco strong{font-size:1.3rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:14px}
input{width:100%;margin-top:4px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dica{margin:4px 0 0;color:var(--muted);font-size:.82rem}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.st{min-height:1.3em;margin-top:12px;font-size:.92rem;color:var(--accent)}
.volta{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <form class="card" id="f" autocomplete="off">
    <h1>Criar conta</h1>
    <p class="sub">Cadastre o seu bar e comece a receber pedidos pelo celular dos clientes.</p>
    <div class="preco"><strong>R$ 79,90</strong> por m&#234;s<br><span class="dica">Cobran&#231;a mensal no cart&#227;o, cancele quando quiser.</span></div>

    <label>Nome do bar<input id="nome" maxlength="80" required></label>
    <label>Endere&#231;o do bar
      <input id="slug" maxlength="40" autocapitalize="none" required>
    </label>
    <p class="dica">S&#243; letras min&#250;sculas, n&#250;meros e h&#237;fen. Vai aparecer nos links das mesas, por exemplo <b id="ex">meu-bar</b>.</p>
    <label>Seu e-mail<input id="email" type="email" maxlength="120" required></label>

    <p id="st" class="st" role="status"></p>
    <button id="ok" type="submit">Continuar para o pagamento</button>
    <a class="volta" href="index.html">Voltar</a>
  </form>
</main>
<script>
const URL_BASE = "https://n8n.automatikai.cloud/webhook/";
const $ = id => document.getElementById(id);
const semAcento = t => t.normalize("NFD").replace(/[^\x00-\x7f]/g, "");
const slugar = t => semAcento(String(t || "").toLowerCase()).replace(/[^0-9a-z]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);

let slugEditado = false;
$("nome").addEventListener("input", () => { if (!slugEditado) { $("slug").value = slugar($("nome").value); $("ex").textContent = $("slug").value || "meu-bar"; } });
$("slug").addEventListener("input", () => { slugEditado = true; $("slug").value = $("slug").value.toLowerCase().replace(/[^0-9a-z-]/g, ""); $("ex").textContent = $("slug").value || "meu-bar"; });

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const st = $("st"), btn = $("ok");
  const nome = $("nome").value.trim(), slug = $("slug").value.trim(), email = $("email").value.trim();
  if (slug.length < 2){ st.style.color = "var(--accent)"; st.textContent = "O endere\u00e7o precisa ter pelo menos 2 caracteres."; return; }
  btn.disabled = true; st.style.color = "var(--muted)"; st.textContent = "Preparando o pagamento\u2026";
  try{
    const r = await fetch(URL_BASE + "saas-criar-conta", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({nome, slug, email})
    });
    let d = null; try{ d = await r.json(); }catch(err){}
    if (r.status === 409 || r.status === 400){
      st.style.color = "var(--accent)"; st.textContent = (d && d.erro) || "Confira os dados e tente de novo."; return;
    }
    if (!r.ok || !d || !d.init_point) throw new Error("falha");
    location.href = d.init_point;
  }catch(err){
    st.style.color = "var(--accent)"; st.textContent = "N\u00e3o foi poss\u00edvel continuar. Tente de novo em instantes.";
  }finally{
    btn.disabled = false;
  }
});
</script>
</body>
</html>
