<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acompanhar pedido</title>
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--ok:#4cc38a;--warn:#ffb000;--surface:#171112}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:20px;background:radial-gradient(ellipse at 15% -10%,rgba(255,74,61,.28),transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{width:100%;max-width:460px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:1.4rem}
.sub{margin:0;color:var(--muted);font-size:.92rem}
.estado{margin:16px 0 4px;font-size:1.5rem;font-weight:700}
.passos{list-style:none;margin:18px 0 0;padding:0}
.passos li{position:relative;padding:0 0 18px 34px;color:var(--muted)}
.passos li:last-child{padding-bottom:0}
.passos li::before{content:"";position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.passos li::after{content:"";position:absolute;left:9px;top:24px;bottom:2px;width:2px;background:var(--line)}
.passos li:last-child::after{display:none}
.passos li.feito{color:var(--ink)}
.passos li.feito::before{background:var(--ok);border-color:var(--ok)}
.passos li.feito::after{background:var(--ok)}
.passos li.atual{color:var(--ink);font-weight:700}
.passos li.atual::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,74,61,.25)}
.linha{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.linha:last-child{border-bottom:0}
.aviso{margin-top:14px;padding:10px 12px;border:1px solid #5a3d12;background:#2a1d10;border-radius:10px;font-size:.92rem}
a.btn{display:block;margin-top:12px;padding:13px;border-radius:10px;text-align:center;font-weight:600;text-decoration:none;background:#25d366;color:#04210f}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--muted);text-align:center;padding:30px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div id="erro" class="card msg" hidden>N&#227;o encontramos este pedido. Confira o link que voc&#234; recebeu.</div>
  <div id="carregando" class="card msg">Carregando o seu pedido&#8230;</div>
  <div id="conteudo" hidden>
    <div class="card">
      <h1 id="rest"></h1>
      <p class="sub" id="ola"></p>
      <div class="estado" id="estado" role="status" aria-live="polite"></div>
      <p class="sub" id="detalhe"></p>
      <ol class="passos" id="passos"></ol>
      <div class="aviso" id="pix-aviso" hidden>Aguardando a confirma&#231;&#227;o do seu Pix. Se voc&#234; j&#225; pagou, o estabelecimento confirma em instantes.</div>
    </div>
    <div class="card">
      <div id="itens"></div>
      <div class="linha" id="l-taxa" hidden><span>Taxa de entrega</span><span id="taxa"></span></div>
      <div class="linha"><strong>Total</strong><strong id="total"></strong></div>
      <div class="linha"><span>Pagamento</span><span id="pag"></span></div>
      <a class="btn" id="zap" target="_blank" rel="noopener" hidden>Falar com o estabelecimento</a>
    </div>
  </div>
</main>
<script>
const URL_BASE = "https://n8n.automatikai.cloud/webhook/";
const $ = id => document.getElementById(id);
const reais = n => Number(n).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const T = (new URLSearchParams(location.search).get("t") || "").replace(/[^0-9a-f]/gi, "").toLowerCase().slice(0, 16);

const PASSOS = {
  entrega: [["novo", "Pedido recebido"], ["preparando", "Em preparo"], ["saiu_entrega", "Saiu para entrega"], ["entregue", "Entregue"]],
  retirada: [["novo", "Pedido recebido"], ["preparando", "Em preparo"], ["pronto", "Pronto para retirar"], ["entregue", "Retirado"]]
};
const DETALHES = {
  novo: "Aguardando o estabelecimento confirmar.",
  preparando: "Estamos preparando o seu pedido.",
  saiu_entrega: "O seu pedido est\u00e1 a caminho.",
  pronto: "Pode vir buscar.",
  entregue: "Obrigado pelo pedido!"
};
const PAGAMENTOS = {pix_antecipado: "Pix", pix_entrega: "Pix ao receber", cartao: "Cart\u00e3o ao receber", dinheiro: "Dinheiro"};

let timer = null;

function desenhar(d){
  const lista = PASSOS[d.tipo] || PASSOS.entrega;
  let idx = lista.findIndex(p => p[0] === d.status);
  if (idx < 0) idx = 0;
  $("rest").textContent = d.restaurante || "Seu pedido";
  $("ola").textContent = d.nome ? "Ol\u00e1, " + d.nome + "!" : "";
  $("estado").textContent = lista[idx][1];
  $("detalhe").textContent = DETALHES[lista[idx][0]] || "";
  $("passos").replaceChildren(...lista.map((p, i) => {
    const li = document.createElement("li");
    li.textContent = p[1];
    li.className = i < idx ? "feito" : (i === idx ? (idx === lista.length - 1 ? "feito" : "atual") : "");
    return li;
  }));
  $("pix-aviso").hidden = !(d.pagamento === "pix_antecipado" && !d.pago_confirmado && d.status !== "entregue");
  $("itens").replaceChildren(...(d.itens || []).map(i => {
    const l = document.createElement("div"); l.className = "linha";
    l.textContent = i.qtd + "x " + i.nome; return l;
  }));
  $("l-taxa").hidden = !(d.taxa_entrega > 0);
  $("taxa").textContent = reais(d.taxa_entrega);
  $("total").textContent = reais(d.total);
  $("pag").textContent = (PAGAMENTOS[d.pagamento] || "-") + (d.pagamento === "pix_antecipado" ? (d.pago_confirmado ? " (pago)" : " (aguardando)") : "");
  const num = String(d.whatsapp || "").replace(/\D/g, "");
  if (num.length >= 10){
    $("zap").href = "https://wa.me/" + (num.length <= 11 ? "55" + num : num);
    $("zap").hidden = false;
  }
  $("carregando").hidden = true; $("erro").hidden = true; $("conteudo").hidden = false;
  if (d.status === "entregue" && timer){ clearInterval(timer); timer = null; }
}

async function consultar(){
  if (T.length !== 16){ $("carregando").hidden = true; $("erro").hidden = false; return; }
  try{
    const r = await fetch(URL_BASE + "saas-acompanhar?t=" + encodeURIComponent(T), {cache: "no-store"});
    if (r.status === 404){ $("carregando").hidden = true; $("conteudo").hidden = true; $("erro").hidden = false; if (timer){ clearInterval(timer); timer = null; } return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    desenhar(await r.json());
  }catch(e){
    if ($("conteudo").hidden) $("carregando").textContent = "N\u00e3o foi poss\u00edvel carregar. Tentando de novo\u2026";
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && timer) consultar(); });
consultar();
timer = setInterval(consultar, 5000);
</script>
</body>
</html>
