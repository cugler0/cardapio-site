<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem("tema");if(t!=="claro"&&t!=="escuro")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"escuro":"claro";document.documentElement.setAttribute("data-tema",t);}catch(e){document.documentElement.setAttribute("data-tema","claro");}})();</script>
<meta name="robots" content="noindex">
<title>Entrar - LaMenu</title>
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--surface:#171112}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 15% -10%,rgba(255,74,61,.28),transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{width:100%;max-width:420px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{margin:0 0 6px;color:var(--muted)}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:14px}
input{width:100%;margin-top:4px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.st{min-height:1.3em;margin-top:12px;font-size:.92rem;color:var(--accent)}
.volta{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:.9rem}
footer.legal{margin-top:18px;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.5}footer.legal p{margin:0 0 6px;color:var(--muted)}footer.legal a{color:var(--muted);text-decoration:underline}footer.legal a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Tema claro ===== */
:root{--on-accent:#160504;--on-ok:#04210f}
:root[data-tema="claro"]{color-scheme:light;--bg:#f7f3ee;--ink:#2b1a16;--muted:#6b5d56;--line:#e2d6ca;--grid:#eee5db;--accent:#cf4526;--ok:#15803d;--warn:#b45309;--surface:#ffffff;--on-accent:#ffffff;--on-ok:#ffffff}
:root[data-tema="claro"] body{background:radial-gradient(ellipse at 15% -10%,rgba(207,69,38,.08),transparent 55%),var(--bg)!important}
[data-tema="claro"] .aviso,[data-tema="claro"] .obs{background:#fff6e5!important;border-color:#efd6a3!important;color:var(--ink)}
[data-tema="claro"] .card,[data-tema="claro"] .ped,[data-tema="claro"] .conta,[data-tema="claro"] .tile{box-shadow:0 1px 2px rgba(60,30,10,.05),0 4px 14px rgba(60,30,10,.06)}
[data-tema="claro"] .barra .dica{background:#2b1a16!important;color:#fff!important;border-color:#2b1a16!important}
[data-tema="claro"] .col.saiu h2{color:#0369a1!important}
[data-tema="claro"] .col.saiu .ped{border-left-color:#0369a1!important}
[data-tema="claro"] .ped.destaque{animation-name:piscaClaro}
@keyframes piscaClaro{50%{background:#fde3dc}}
[data-tema="claro"] .chamado{background:#fff4dc}
[data-tema="claro"] .chamado.conta{background:#e8f6ee}
[data-tema="claro"] h1[style*="00e5ff"],[data-tema="claro"] main > .card > h1{color:var(--accent)!important;text-shadow:none!important}
[data-tema="claro"] .aceite a,[data-tema="claro"] .legal-txt a{color:#0369a1}
[data-tema="claro"] p a.zap{color:#15803d}
button.tema-btn{background:transparent!important;border:1px solid var(--line)!important;color:var(--muted)!important;padding:6px 12px!important;border-radius:999px!important;font-size:.8rem!important;font-weight:600;margin:10px auto 0;display:inline-block;cursor:pointer}
:root[data-tema="claro"]{--h1:var(--accent);--h1s:none;--h2c:var(--accent);--lnk:#0369a1}
</style>
</head>
<body>
<main>
  <form class="card" id="f" autocomplete="off">
    <h1>Entrar</h1>
    <p class="sub">Digite o endereço do seu bar e a chave de acesso.</p>
    <label>Endereço do bar<input id="rest" autocapitalize="none" placeholder="ex.: pizzahug" required></label>
    <label>Chave de acesso<input id="chave" type="password" required></label>
    <p id="st" class="st" role="status"></p>
    <button id="ok" type="submit">Entrar</button>
    <a class="volta" href="index.html">Voltar</a>
  </form>
<footer class="legal"><p><a href="privacidade.html">Privacidade</a> &middot; <a href="termos.html">Termos de uso</a> &middot; <a href="reembolso.html">Cancelamento e reembolso</a></p><p>LaMenu<br>Contato: WhatsApp (12) 99762-1359</p><p><button type="button" class="tema-btn" id="tema-btn">Tema</button></p></footer>
</main>
<script>
const URL_BASE = "https://n8n.automatikai.cloud/webhook/";
const $ = id => document.getElementById(id);
const limpaSlug = v => String(v || "").replace(/[^0-9a-z-]/gi, "").toLowerCase().slice(0, 40);

$("rest").value = limpaSlug(new URLSearchParams(location.search).get("r"));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const st = $("st"), btn = $("ok");
  const r = limpaSlug($("rest").value), chave = $("chave").value.trim();
  if (!r || !chave){ st.textContent = "Preencha os dois campos."; return; }
  btn.disabled = true; st.style.color = "var(--muted)"; st.textContent = "Entrando…";
  try{
    const resp = await fetch(URL_BASE + "saas-admin-listar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({r, chave})
    });
    if (resp.status === 401){ st.style.color = "var(--accent)"; st.textContent = "Endereço ou chave incorretos."; return; }
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const d = await resp.json();
    try{
      sessionStorage.setItem("rest", r);
      sessionStorage.setItem("chave", chave);
      sessionStorage.setItem("nome", (d.restaurante && d.restaurante.nome) || r);
    }catch(err){}
    location.href = "app.html";
  }catch(err){
    st.style.color = "var(--accent)"; st.textContent = "Não foi possível conectar. Tente de novo.";
  }finally{
    btn.disabled = false;
  }
});
</script>
<script>
(function(){
  var b = document.getElementById("tema-btn"); if (!b) return;
  function rot(){ b.textContent = document.documentElement.getAttribute("data-tema") === "escuro" ? "Tema: escuro" : "Tema: claro"; }
  rot();
  b.addEventListener("click", function(){
    var novo = document.documentElement.getAttribute("data-tema") === "escuro" ? "claro" : "escuro";
    document.documentElement.setAttribute("data-tema", novo);
    try{ localStorage.setItem("tema", novo); }catch(e){}
    rot();
  });
})();
</script>
</body>
</html>
