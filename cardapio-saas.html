<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card&#225;pio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--surface:rgba(18,14,15,.86)}
*{box-sizing:border-box}
.gt{position:fixed;z-index:-1;width:150px;height:525px;pointer-events:none}
.g1{left:-34px;bottom:-70px;transform:rotate(18deg)}
.g2{right:-34px;bottom:-70px;transform:rotate(-18deg)}
@media (max-width:700px){.gt{width:96px;height:336px}}
.topo{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.topo .sub{margin:0}
.emblema{width:64px;height:72px;flex:none;filter:drop-shadow(0 0 14px rgba(255,74,61,.65))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 12% -10%,rgba(255,74,61,.30),transparent 55%),radial-gradient(ellipse at 92% 0%,rgba(255,176,0,.18),transparent 50%),linear-gradient(rgba(13,11,12,.80),rgba(13,11,12,.86)),url("fundo.jpg") center top/clamp(560px,70vw,1000px) auto repeat}
body{margin:0;background:var(--bg);position:relative;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
main{max-width:1400px;margin:0 auto;padding:28px 18px 120px}
#conteudo{columns:3 320px;column-gap:18px}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-size:3.4rem;letter-spacing:.05em;line-height:1;margin:0 0 6px;font-weight:400;text-transform:uppercase;text-shadow:0 0 22px rgba(255,74,61,.6)}
.sub{margin:0 0 28px;color:var(--muted)}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;margin:0 -18px 8px;padding-left:18px;position:sticky;top:0;background:rgba(13,11,12,.92);z-index:1}
nav a{flex:none;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:.9rem;background:var(--surface)}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin:0 0 18px;break-inside:avoid;scroll-margin-top:60px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 6px}
h2{font-family:"Bebas Neue",Impact,sans-serif;font-size:1.9rem;letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--accent);font-weight:400;color:var(--accent)}
.item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.nome{font-weight:600}
.desc{color:var(--muted);font-size:.92rem;margin-top:2px}
.preco{font-weight:600;white-space:nowrap}
.msg{padding:28px 0;color:var(--muted)}
button{margin-top:10px;padding:9px 16px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font:inherit;cursor:pointer}

.dir{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qtd{display:flex;align-items:center;gap:10px}
.qtd button{margin:0;width:36px;height:36px;padding:0;font-size:1.3rem;line-height:1;border-radius:50%}
.qtd span{min-width:20px;text-align:center;font-weight:600}
#barra{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(13,11,12,.97);border-top:2px solid var(--accent);z-index:5}
#barra.on{display:flex}
#barra button,.cheio{margin:0;background:var(--accent);color:#fff;border:0;font-weight:600}
.cheio{width:100%;padding:12px}
dialog{background:#171112;color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(480px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog h2{margin-bottom:10px}
.linha{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
label{display:block;margin-top:12px;font-size:.92rem;color:var(--muted)}
input,textarea{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0d0b0c;color:var(--ink);font:inherit}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}
#p-msg{padding:10px 0 0}
.sem-mesa .qtd{display:none}
select{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0d0b0c;color:var(--ink);font:inherit}
select:focus-visible{outline:2px solid var(--accent)}
.tipos{display:flex;gap:10px;margin-top:6px}
.tipo{flex:1;margin:0;padding:10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px}
.tipo input{width:auto;margin:0}
.tipo:has(input:checked){border-color:var(--accent);background:rgba(255,74,61,.12)}
[hidden]{display:none!important}
.sem-mesa #barra{display:none!important}
.esq{display:flex;align-items:center;gap:12px;min-width:0}
.foto{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--line);background:#1b1415}
@media (max-width:420px){.foto{width:56px;height:56px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="gt" viewBox="0 0 120 420"><g fill="#ff4a3d" fill-opacity=".10" stroke="#fff" stroke-opacity=".22" stroke-width="2"><rect x="49" y="6" width="22" height="38" rx="5"/><rect x="55" y="44" width="10" height="172"/><path d="M60 200C25 190 12 215 22 245 8 265 8 320 40 345 55 358 65 358 80 345 112 320 112 265 98 245 108 215 95 190 60 200Z"/><rect x="42" y="252" width="36" height="9" rx="2"/><rect x="42" y="284" width="36" height="9" rx="2"/><rect x="44" y="322" width="32" height="6" rx="2"/></g></symbol></svg>
<svg class="gt g1" aria-hidden="true"><use href="#gt"/></svg>
<svg class="gt g2" aria-hidden="true"><use href="#gt"/></svg>
<main>
  <header class="topo">
    <svg class="emblema" viewBox="0 0 64 72" aria-hidden="true"><path d="M32 3 60 14V38C60 54 47 65 32 70 17 65 4 54 4 38V14Z" fill="#1a0f10" stroke="#ff4a3d" stroke-width="3"/><path d="M36 16 22 40H31L27 58 44 32H34Z" fill="#ffb000"/></svg>
    <div>
      <h1 id="titulo">Card&#225;pio</h1>
      <p class="sub" id="sub">Pre&#231;os atualizados em tempo real.</p>
    </div>
  </header>
  <nav id="menu" aria-label="Categorias"></nav>
  <div id="conteudo"><p class="msg">Carregando o card&#225;pio&#8230;</p></div>
</main>
<div id="barra"><div><strong id="b-qtd"></strong> &middot; <span id="b-total"></span></div><button id="b-ver">Ver pedido</button></div>
<dialog id="painel">
  <h2>Seu pedido</h2>
  <div id="p-lista"></div>
  <div class="linha" id="l-sub" hidden><span>Subtotal</span><span id="p-sub"></span></div>
  <div class="linha" id="l-taxa" hidden><span>Taxa de entrega</span><span id="p-taxa"></span></div>
  <div class="linha"><strong>Total</strong><strong id="p-total"></strong></div>
  <div id="bloco-mesa"><label>Mesa<input id="p-mesa" inputmode="numeric" maxlength="10"></label></div>
  <div id="bloco-deliv" hidden>
    <div class="tipos" role="radiogroup" aria-label="Como receber">
      <label class="tipo"><input type="radio" name="p-tipo" value="entrega" checked> Entrega</label>
      <label class="tipo"><input type="radio" name="p-tipo" value="retirada"> Retirada</label>
    </div>
    <label>Telefone (WhatsApp)<input id="p-tel" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="(67) 99999-9999"></label>
    <div id="bloco-end">
      <label>Endere&#231;o<input id="p-end" maxlength="200" autocomplete="street-address" placeholder="Rua, n&#250;mero, complemento"></label>
      <label>Bairro<select id="p-bairro"></select></label>
    </div>
    <label>Pagamento
      <select id="p-pag">
        <option value="">Escolha como vai pagar</option>
        <option value="pix_antecipado">Pix agora (antes de receber)</option>
        <option value="pix_entrega">Pix ao receber</option>
        <option value="cartao">Cart&#227;o ao receber</option>
        <option value="dinheiro">Dinheiro</option>
      </select>
    </label>
    <div id="bloco-troco" hidden><label>Troco para quanto? (opcional)<input id="p-troco" inputmode="decimal" maxlength="10" placeholder="Ex.: 100"></label></div>
  </div>
  <label><span id="rot-nome">Seu nome (para separar a sua conta)</span><input id="p-nome" maxlength="40" autocomplete="given-name" placeholder="Ex.: Jo&#227;o"></label>
  <label>Observa&#231;&#245;es (opcional)<textarea id="p-obs" maxlength="200" rows="3" placeholder="Ex.: 4 copos, sem gelo"></textarea></label>
  <p id="p-msg" class="msg" role="status"></p>
  <button class="cheio" id="p-enviar">Enviar pedido</button>
  <button id="p-fechar">Voltar ao card&#225;pio</button>
</dialog>
<script>
// ===== CONFIGURA\u00c7\u00c3O (s\u00f3 mexa aqui) =====
const NOME_DO_RESTAURANTE = "Card\u00e1pio";
const URL_BASE = "https://n8n.automatikai.cloud/webhook/";
const URL_DO_CARDAPIO = URL_BASE + "saas-cardapio";
const URL_DO_PEDIDO = URL_BASE + "saas-pedido";
const URL_DA_SESSAO = URL_BASE + "saas-abrir";
// =======================================

const $ = id => document.getElementById(id);
$("titulo").textContent = NOME_DO_RESTAURANTE;
document.title = NOME_DO_RESTAURANTE;

let REST = (new URLSearchParams(location.search).get("r") || "").replace(/[^0-9a-z-]/gi, "").toLowerCase().slice(0, 40);
try{
  if (REST) sessionStorage.setItem("rest", REST);
  else REST = (sessionStorage.getItem("rest") || "").replace(/[^0-9a-z-]/gi, "").toLowerCase().slice(0, 40);
}catch(e){}

let MESA = (new URLSearchParams(location.search).get("mesa") || "").replace(/[^0-9A-Za-z]/g, "").slice(0, 10);
try{
  if (MESA) sessionStorage.setItem("mesa", MESA);
  else MESA = (sessionStorage.getItem("mesa") || "").replace(/[^0-9A-Za-z]/g, "").slice(0, 10);
}catch(e){}
if (location.search) history.replaceState(null, "", location.pathname); // esconde ?mesa=N da barra de endere\u00e7o
let MODO = MESA ? "mesa" : "";
let DELIVERY = {ativo: false, pedido_minimo: 0, bairros: []};
if (!MESA) { document.body.classList.add("sem-mesa"); $("sub").textContent = "Para fazer pedidos, aproxime o celular da plaquinha da sua mesa."; }
if (MESA) $("sub").textContent = "Mesa " + MESA + " \u00b7 Pre\u00e7os atualizados em tempo real.";

const limpa = v => String(v ?? "").trim();
const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);
const reais = n => Number(n).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const escapa = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML.replace(/"/g, "&quot;"); };
function imagem(foto, nome){
  if (!foto) return "";
  const src = /^https?:\/\//i.test(foto) ? foto : "fotos/" + encodeURIComponent(foto);
  return '<img class="foto" src="' + escapa(src) + '" alt="' + escapa(nome) + '" width="72" height="72" loading="lazy" onerror="this.remove()">';
}

const catalogo = {};      // id -> {nome, preco}
const carrinho = new Map(); // id -> quantidade

function resumo(){
  let qtd = 0, total = 0;
  for (const [id, q] of carrinho){ qtd += q; total += q * Number(catalogo[id].preco); }
  return {qtd, total};
}
function atualizar(){
  const {qtd, total} = resumo();
  $("barra").classList.toggle("on", qtd > 0);
  $("b-qtd").textContent = qtd + (qtd === 1 ? " item" : " itens");
  $("b-total").textContent = reais(total);
}
function mudar(id, d){
  if (expirado()) return expirou();
  const q = Math.max(0, Math.min(20, (carrinho.get(id) || 0) + d));
  if (q) carrinho.set(id, q); else carrinho.delete(id);
  const el = document.querySelector('[data-q="' + id + '"]');
  if (el) el.textContent = q;
  atualizar();
}

async function carregar(){
  const caixa = $("conteudo"), menu = $("menu");
  try{
    if(!REST) throw new Error("sem restaurante");
    const resp = await fetch(URL_DO_CARDAPIO + "?r=" + encodeURIComponent(REST), {cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP " + resp.status);
    const resposta = await resp.json();
    const dados = (resposta.itens || []).sort((a, b) => a.ordem - b.ordem);
    $("titulo").textContent = resposta.restaurante.nome;
    document.title = resposta.restaurante.nome;
    const dv = resposta.delivery || {};
    DELIVERY = {ativo: !!dv.ativo, pedido_minimo: Number(dv.pedido_minimo) || 0, bairros: Array.isArray(dv.bairros) ? dv.bairros : []};
    if (!MESA && DELIVERY.ativo){
      MODO = "delivery";
      document.body.classList.remove("sem-mesa");
      $("sub").textContent = "Pe\u00e7a pelo celular: entrega ou retirada. Pre\u00e7os atualizados em tempo real.";
    }

    const grupos = new Map();
    let n = 0;
    for(const linha of dados){
      if(!linha.disponivel) continue;
      const cat = maiuscula(limpa(linha.categoria));
      const nome = maiuscula(limpa(linha.nome));
      if(!cat || !nome) continue;
      const id = "i" + (n++);
      catalogo[id] = {nome, categoria: cat, preco: Number(linha.preco) || 0};
      if(!grupos.has(cat)) grupos.set(cat, []);
      grupos.get(cat).push({id, nome, desc: limpa(linha.descricao), foto: limpa(linha.foto), preco: catalogo[id].preco});
    }
    if(!grupos.size){ caixa.innerHTML = '<p class="msg">Nenhum item dispon\u00edvel no momento.</p>'; return; }

    let html = "", links = "", i = 0;
    for(const [cat, itens] of grupos){
      const sid = "cat" + (i++);
      links += '<a href="#' + sid + '">' + escapa(cat) + '</a>';
      html += '<section id="' + sid + '"><h2>' + escapa(cat) + '</h2>';
      for(const it of itens){
        html += '<div class="item"><div class="esq">' + imagem(it.foto, it.nome) + '<div><div class="nome">' + escapa(it.nome) + '</div>' +
          (it.desc ? '<div class="desc">' + escapa(it.desc) + '</div>' : '') + '</div></div>' +
          '<div class="dir"><div class="preco">' + reais(it.preco) + '</div>' +
          '<div class="qtd"><button data-a="-1" data-k="' + it.id + '" aria-label="Remover um">\u2212</button>' +
          '<span data-q="' + it.id + '">0</span>' +
          '<button data-a="1" data-k="' + it.id + '" aria-label="Adicionar um">+</button></div></div></div>';
      }
      html += '</section>';
    }
    menu.innerHTML = links;
    caixa.innerHTML = html;
  }catch(e){
    caixa.innerHTML = '<p class="msg">N\u00e3o foi poss\u00edvel carregar o card\u00e1pio. Verifique a internet e tente de novo.</p><button id="de-novo">Tentar de novo</button>';
    $("de-novo").addEventListener("click", carregar);
  }
}

$("conteudo").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]");
  if (b) mudar(b.dataset.k, Number(b.dataset.a));
});

function abrirPainel(){
  let linhas = "";
  for (const [id, q] of carrinho){
    linhas += '<div class="linha"><span>' + q + 'x ' + escapa(catalogo[id].nome) + '</span><span>' + reais(q * catalogo[id].preco) + '</span></div>';
  }
  $("p-lista").innerHTML = linhas;
  const delivery = MODO === "delivery";
  $("bloco-mesa").hidden = delivery;
  $("bloco-deliv").hidden = !delivery;
  $("rot-nome").textContent = delivery ? "Seu nome" : "Seu nome (para separar a sua conta)";
  $("p-mesa").value = MESA;
  $("p-mesa").readOnly = !!MESA;
  try{ $("p-nome").value = sessionStorage.getItem("nome") || localStorage.getItem("nome") || $("p-nome").value; }catch(e){}
  if (delivery){
    const sel = $("p-bairro");
    if (sel.options.length === 0){
      const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Escolha o bairro"; sel.append(o0);
      for (const b of DELIVERY.bairros){
        const o = document.createElement("option"); o.value = b.nome;
        o.textContent = b.nome + " - " + reais(b.taxa); sel.append(o);
      }
    }
    const rEnt = document.querySelector('input[name="p-tipo"][value="entrega"]');
    const rRet = document.querySelector('input[name="p-tipo"][value="retirada"]');
    if (!DELIVERY.bairros.length){ rEnt.disabled = true; rRet.checked = true; }
    try{
      if (!$("p-tel").value) $("p-tel").value = localStorage.getItem("tel") || "";
      if (!$("p-end").value) $("p-end").value = localStorage.getItem("end") || "";
    }catch(e){}
  }
  $("p-msg").textContent = "";
  atualizarDeliv();
  $("p-enviar").hidden = false;
  $("painel").showModal();
}

function tipoAtual(){
  const r = document.querySelector('input[name="p-tipo"]:checked');
  return r ? r.value : "entrega";
}
function taxaAtual(){
  if (MODO !== "delivery" || tipoAtual() !== "entrega") return 0;
  const b = DELIVERY.bairros.find(x => x.nome === $("p-bairro").value);
  return b ? Number(b.taxa) || 0 : 0;
}
function atualizarDeliv(){
  const sub = resumo().total;
  const delivery = MODO === "delivery";
  $("l-sub").hidden = !delivery;
  $("l-taxa").hidden = !delivery || tipoAtual() !== "entrega";
  if (!delivery){ $("p-total").textContent = reais(sub); return; }
  const entrega = tipoAtual() === "entrega";
  $("bloco-end").hidden = !entrega;
  $("bloco-troco").hidden = $("p-pag").value !== "dinheiro";
  const taxa = taxaAtual();
  $("p-sub").textContent = reais(sub);
  $("p-taxa").textContent = reais(taxa);
  $("p-total").textContent = reais(sub + taxa);
  const min = DELIVERY.pedido_minimo;
  $("p-msg").textContent = (entrega && min > 0 && sub < min) ? "Pedido m\u00ednimo para entrega: " + reais(min) + "." : "";
}
$("bloco-deliv").addEventListener("change", atualizarDeliv);
$("b-ver").addEventListener("click", abrirPainel);
$("p-fechar").addEventListener("click", () => $("painel").close());

$("p-enviar").addEventListener("click", async () => {
  const msg = $("p-msg"), btn = $("p-enviar");
  if (expirado()) return expirou();
  const delivery = MODO === "delivery";
  const nome = limpa($("p-nome").value);
  if (!carrinho.size) return;
  const itens = [...carrinho].map(([id, q]) => ({nome: catalogo[id].nome, qtd: q}));
  let corpo;
  let tel = "";
  let endereco = "";
  if (delivery){
    const tipo = tipoAtual();
    if (nome.length < 2){ msg.textContent = "Digite o seu nome."; return; }
    tel = limpa($("p-tel").value).replace(/\D/g, "");
    if (tel.length < 10){ msg.textContent = "Digite o telefone com DDD."; return; }
    let bairro = "";
    if (tipo === "entrega"){
      endereco = limpa($("p-end").value);
      if (endereco.length < 5){ msg.textContent = "Digite o endere\u00e7o de entrega."; return; }
      bairro = $("p-bairro").value;
      if (!bairro){ msg.textContent = "Escolha o bairro."; return; }
    }
    const pag = $("p-pag").value;
    if (!pag){ msg.textContent = "Escolha como vai pagar."; return; }
    const troco = pag === "dinheiro" ? Number(limpa($("p-troco").value).replace(",", ".")) : 0;
    corpo = {r: REST, tipo, nome, telefone: tel, endereco, bairro, pagamento: pag, observacoes: limpa($("p-obs").value), itens};
    if (troco > 0) corpo.troco_para = troco;
  } else {
    const mesa = limpa($("p-mesa").value);
    if (!mesa){ msg.textContent = "Digite o n\u00famero da sua mesa."; return; }
    if (nome.length < 2){ msg.textContent = "Digite seu nome para separar a sua conta."; return; }
    corpo = {r: REST, tipo: "mesa", mesa, sessao: SESSAO, nome, observacoes: limpa($("p-obs").value), itens};
  }
  btn.disabled = true; msg.textContent = "Enviando\u2026";
  try{
    const r = await fetch(URL_DO_PEDIDO, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(corpo)
    });
    if (r.status === 403) {
      if (delivery) { msg.textContent = "O delivery n\u00e3o est\u00e1 dispon\u00edvel no momento."; return; }
      encerrada(); return;
    }
    if (r.status === 404) { msg.textContent = "Restaurante n\u00e3o encontrado."; return; }
    if (r.status === 400) {
      let d = null; try{ d = await r.json(); }catch(err){}
      msg.textContent = (delivery && d && typeof d.erro === "string" && d.erro) ? d.erro : "Algum item n\u00e3o est\u00e1 mais dispon\u00edvel. Recarregue a p\u00e1gina e tente de novo.";
      return;
    }
    if(!r.ok) throw new Error("HTTP " + r.status);
    msg.textContent = delivery ? "Pedido enviado! O estabelecimento vai confirmar em instantes." : "Pedido enviado! J\u00e1 avisamos o atendimento.";
    carrinho.clear();
    $("p-obs").value = "";
    try{
      sessionStorage.setItem("nome", nome);
      if (delivery){ localStorage.setItem("nome", nome); localStorage.setItem("tel", tel); if (endereco) localStorage.setItem("end", endereco); }
    }catch(e){}
    document.querySelectorAll("[data-q]").forEach(el => el.textContent = "0");
    atualizar();
    btn.hidden = true;
  }catch(e){
    msg.textContent = "N\u00e3o foi poss\u00edvel enviar. Tente de novo ou chame o gar\u00e7om.";
  }finally{
    btn.disabled = false;
  }
});

// ===== Validade da sess\u00e3o: a p\u00e1gina s\u00f3 aceita pedidos por um tempo depois de aberta =====
const ABERTO_EM = Date.now();
const VALIDADE_MS = 2 * 60 * 60 * 1000; // 2 horas
function expirado(){ return !!MESA && Date.now() - ABERTO_EM > VALIDADE_MS; }
function expirou(){
  carrinho.clear();
  atualizar();
  document.body.classList.add("sem-mesa");
  $("sub").textContent = "Sess\u00e3o encerrada. Aproxime o celular da plaquinha da mesa para pedir de novo.";
  if ($("painel").open) $("painel").close();
}
setInterval(() => { if (MESA && expirado()) expirou(); }, 60000);

// ===== Sess\u00e3o da mesa: cada leitura da tag abre uma sess\u00e3o; o /fechar do gar\u00e7om encerra =====
let SESSAO = "";
async function abrirSessao(){
  if (!MESA) return;
  try{
    const r = await fetch(URL_DA_SESSAO + "?r=" + encodeURIComponent(REST) + "&mesa=" + encodeURIComponent(MESA), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if(!d.sessao) throw new Error("sem sessao");
    SESSAO = d.sessao;
  }catch(e){
    document.body.classList.add("sem-mesa");
    $("sub").textContent = "N\u00e3o foi poss\u00edvel abrir a mesa. Aproxime o celular da plaquinha de novo.";
  }
}
function encerrada(){
  carrinho.clear();
  atualizar();
  document.body.classList.add("sem-mesa");
  $("sub").textContent = "Mesa encerrada. Aproxime o celular da plaquinha da mesa para pedir de novo.";
  if ($("painel").open) $("painel").close();
}

abrirSessao();
carregar();
</script>
