<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> MenuEasy</title>
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--surface:#171112}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 15% -10%,rgba(255,74,61,.28),transparent 55%),radial-gradient(ellipse at 90% 0%,rgba(255,176,0,.14),transparent 50%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{width:100%;max-width:440px;text-align:center}
h1{margin:0 0 8px;font-size:2.2rem;letter-spacing:.01em}
p{margin:0 0 28px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px}
a.btn{display:block;padding:14px 18px;border-radius:10px;font:inherit;font-weight:600;text-decoration:none;text-align:center;margin-top:12px}
a.principal{background:var(--accent);color:#fff}
a.sec{border:1px solid var(--line);color:var(--ink)}
a.off{border:1px dashed var(--line);color:var(--muted);pointer-events:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{display:block;margin-top:18px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>MenuEasy</h1>
    <p>Seus clientes pedem pelo celular, e os pedidos aparecem na hora no seu painel.</p>
    <a class="btn principal" href="entrar.html">Entrar</a>
    <a class="btn sec" href="criar-conta.html">Criar conta</a>
    <small>Ja é cliente? Use o endereço do seu bar e a chave de acesso.</small>
  </div>
</main>
</body>
</html>
