<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pedidos - MenuEasy</title>
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--ok:#4cc38a;--warn:#ffb000;--surface:#171112}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:1300px;margin:0 auto;padding:16px 14px 60px}
h1{margin:0;font-size:1.5rem}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}
input{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
.st{font-size:.9rem;min-height:1.2em}
.st.erro{color:var(--accent)}
.rodape{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pulso{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}
.pulso.off{background:var(--accent)}
.colunas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media (max-width:900px){.colunas{grid-template-columns:1fr}}
.col h2{margin:0 0 10px;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.col.novo h2{color:var(--accent)}
.col.preparando h2{color:var(--warn)}
.col.entregue h2{color:var(--ok)}
.vazio{color:var(--muted);font-size:.9rem;padding:10px 0}
.ped{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.col.preparando .ped{border-left-color:var(--warn)}
.col.entregue .ped{border-left-color:var(--ok);opacity:.75}
.ped.destaque{animation:pisca 1.2s ease-in-out 3}
@keyframes pisca{50%{background:#3a1a1c}}
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mesa{font-size:1.3rem;font-weight:700}
.hora{color:var(--muted);font-size:.85rem}
.quem{color:var(--muted);font-size:.9rem}
.itens{margin:8px 0;padding:0;list-style:none}
.itens li{padding:2px 0}
.obs{background:#2a1d10;border:1px solid #5a3d12;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:.92rem}
.tot{font-weight:600;margin-top:6px}
.ped button{margin-top:10px;width:100%}
.ped .mini{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.ped .mini button{margin:0;width:auto;padding:3px 9px;font-size:.78rem;font-weight:500;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px}
.ped .mini button:hover{color:var(--ink);border-color:var(--muted)}
.ped .mini button.del:hover{color:var(--accent);border-color:var(--accent)}
.fecha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fecha select{padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.fecha .st{margin-left:4px}
.fecha .st.ok{color:var(--ok)}
.contas{margin:0 0 16px}
.contas h2{margin:0 0 10px;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.contas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.conta{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.conta .m{font-weight:700;font-size:1.1rem}
.pessoa{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pessoa .v{font-weight:600;white-space:nowrap}
.pessoa button{padding:6px 10px;font-size:.85rem}
.conta .tm{display:flex;justify-content:space-between;padding-top:8px;border-top:2px solid var(--line);font-weight:700}
[hidden]{display:none!important}
.abas{display:flex;gap:8px;margin:0 0 14px}
.aba{display:flex;align-items:center;gap:8px;padding:10px 18px;background:transparent;border:1px solid var(--line);color:var(--ink)}
.aba.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{min-width:22px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:.8rem;text-align:center}
.aba.on .badge{background:#fff;color:var(--accent)}
.aba:not(.on) .badge.tem{background:var(--accent);color:#fff}
.colunas4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.colunas4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.colunas4{grid-template-columns:1fr}}
.col.saiu h2{color:#5cc8ff}
.col.saiu .ped{border-left-color:#5cc8ff}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.04em;background:var(--accent);color:#fff}
.tag.ret{background:#2b6cb0}
.tel{color:var(--ink);font-size:.92rem}
.end{margin:4px 0;font-size:.95rem}
.pag{margin-top:6px;font-size:.92rem;color:var(--ink)}
.pag b{color:var(--warn)}
.pag b.ok{color:var(--ok)}
.ped a.zap{display:block;margin-top:8px;padding:9px;border-radius:8px;background:#25d366;color:#04210f;text-align:center;font-weight:600;text-decoration:none}
.ped a.zap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.voltar{display:inline-block;padding:10px 16px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font:inherit;font-weight:600;background:transparent}
a.voltar:hover{border-color:var(--accent)}
a.voltar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <section id="login" class="card" style="max-width:460px;margin:40px auto">
    <h1>Pedidos</h1>
    <p class="sub">Entre para acompanhar os pedidos em tempo real.</p>
    <label>Restaurante (endere&#231;o do bar)<input id="l-rest" autocapitalize="none" autocomplete="off" placeholder="ex.: pizzahug"></label>
    <label>Chave de acesso<input id="l-chave" type="password" autocomplete="off"></label>
    <div class="rodape"><span id="l-st" class="st" role="status"></span><button id="l-entrar">Entrar</button></div>
  </section>

  <section id="app" hidden>
    <div class="topo">
      <div>
        <h1 id="a-nome"></h1>
        <p class="sub"><span id="a-pulso" class="pulso"></span><span id="a-status">Conectando&#8230;</span></p>
      </div>
      <div class="acoes">
        <a class="voltar" href="app.html">&larr; Menu</a>
        <button class="sec" id="a-som">Som: ligado</button>
        <button class="sec" id="a-sair">Sair</button>
      </div>
    </div>
    <div class="abas" role="tablist">
      <button class="aba on" id="aba-mesas" data-aba="mesas" role="tab"><span id="t-aba">Mesas</span> <span class="badge" id="b-mesas">0</span></button>
      <button class="aba" id="aba-delivery" data-aba="delivery" role="tab">Delivery <span class="badge" id="b-delivery">0</span></button>
    </div>
    <div id="vista-mesas">
    <div class="fecha">
      <strong id="t-fechar">Fechar mesa</strong>
      <select id="f-mesa" aria-label="Mesa"></select>
      <button class="sec" id="f-btn">Fechar mesa</button>
      <span id="f-st" class="st" role="status"></span>
    </div>
    <div class="contas"><h2>Contas abertas</h2><div id="contas" class="contas-grid"></div><p id="c-st" class="st" role="status"></p></div>
    <div class="colunas">
      <div class="col novo"><h2>Novos <span id="n-novo">0</span></h2><div id="c-novo"></div></div>
      <div class="col preparando"><h2>Preparando <span id="n-preparando">0</span></h2><div id="c-preparando"></div></div>
      <div class="col entregue"><h2>Entregues <span id="n-entregue">0</span></h2><div id="c-entregue"></div></div>
    </div>
    </div>
    <div id="vista-delivery" hidden>
      <div class="colunas4">
        <div class="col novo"><h2>Novos <span id="nd-novo">0</span></h2><div id="d-novo"></div></div>
        <div class="col preparando"><h2>Preparando <span id="nd-preparando">0</span></h2><div id="d-preparando"></div></div>
        <div class="col saiu"><h2>A caminho / Pronto <span id="nd-saiu">0</span></h2><div id="d-saiu"></div></div>
        <div class="col entregue"><h2>Conclu&#237;dos <span id="nd-entregue">0</span></h2><div id="d-entregue"></div></div>
      </div>
    </div>
  </section>
</main>
<script>
const URL_BASE = "https://n8n.automatikai.cloud/webhook/";
const INTERVALO_MS = 5000;
const $ = id => document.getElementById(id);
const reais = n => Number(n).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const limpaSlug = v => String(v || "").replace(/[^0-9a-z-]/gi, "").toLowerCase().slice(0, 40);

let ROT = "Mesa"; const fem = () => /o$/i.test(ROT) ? "o" : "a";
try{ ROT = sessionStorage.getItem("rot") || "Mesa"; }catch(e){}
let ULTIMOS = [], REST = "", CHAVE = "", conhecidos = null, somLigado = true, ocupado = false, timer = null, ctx = null, wake = null;

async function api(caminho, corpo){
  const r = await fetch(URL_BASE + caminho, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({r: REST, chave: CHAVE, ...corpo})
  });
  let dados = null;
  try{ dados = await r.json(); }catch(e){}
  return {status: r.status, dados};
}

function bip(){
  if (!somLigado || !ctx) return;
  try{
    [0, 0.25, 0.5].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.22);
    });
  }catch(e){}
}

const tipoDe = p => p.tipo || "mesa";
const rotuloPedido = p => tipoDe(p) === "mesa" ? ROT + " " + p.mesa : (tipoDe(p) === "entrega" ? "Entrega" : "Retirada");

function avisar(novos){
  bip();
  try{
    if ("Notification" in window && Notification.permission === "granted"){
      const p = novos[0];
      new Notification("Novo pedido - " + rotuloPedido(p), {body: novos.length > 1 ? novos.length + " pedidos novos" : "Toque para ver"});
    }
  }catch(e){}
}

function cartao(p, destaque){
  const d = document.createElement("div");
  d.className = "ped" + (destaque ? " destaque" : "");
  const cab = document.createElement("div"); cab.className = "cab";
  const mesa = document.createElement("span"); mesa.className = "mesa"; mesa.textContent = tipoDe(p) === "mesa" ? ROT + " " + p.mesa : String(p.mesa);
  const hora = document.createElement("span"); hora.className = "hora";
  hora.textContent = new Date(p.criado_em).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
  cab.append(mesa, hora); d.append(cab);

  if (p.nome){ const q = document.createElement("div"); q.className = "quem"; q.textContent = p.nome; d.append(q); }

  const ul = document.createElement("ul"); ul.className = "itens";
  for (const it of (Array.isArray(p.itens) ? p.itens : [])){
    const li = document.createElement("li"); li.textContent = it.qtd + "x " + it.nome; ul.append(li);
  }
  d.append(ul);

  if (p.observacoes){ const o = document.createElement("div"); o.className = "obs"; o.textContent = "Obs: " + p.observacoes; d.append(o); }

  const t = document.createElement("div"); t.className = "tot"; t.textContent = "Total " + reais(p.total); d.append(t);

  const proximo = p.status === "novo" ? ["preparando", "Come\u00e7ar a preparar"] : p.status === "preparando" ? ["entregue", "Marcar como entregue"] : null;
  if (proximo){
    const b = document.createElement("button"); b.textContent = proximo[1];
    b.addEventListener("click", async () => {
      b.disabled = true;
      try{
        const {status, dados} = await api("saas-admin-status", {pedido_id: p.id, status: proximo[0]});
        if (status === 401) return sair();
        if (!(status === 200 && dados && dados.ok)) throw new Error("falha");
        await atualizar();
      }catch(e){
        b.disabled = false; b.textContent = "Erro. Tente de novo";
      }
    });
    d.append(b);
  }
  d.append(miniAcoes(p));
  return d;
}

async function mudarStatus(p, novo, b){
  b.disabled = true;
  try{
    const {status, dados} = await api("saas-admin-status", {pedido_id: p.id, status: novo});
    if (status === 401) return sair();
    if (!(status === 200 && dados && dados.ok)) throw new Error("falha");
    await atualizar();
  }catch(e){
    b.disabled = false; b.textContent = "Erro. Tente de novo";
  }
}

const PAGAMENTOS = {pix_antecipado: "Pix antecipado", pix_entrega: "Pix ao receber", cartao: "Cart\u00e3o ao receber", dinheiro: "Dinheiro"};

function msgZap(p){
  const primeiro = p.nome ? String(p.nome).trim().split(" ")[0] : "";
  const ola = "Ol\u00e1" + (primeiro ? ", " + primeiro : "") + "! ";
  if (p.status === "novo") return ola + "Recebemos o seu pedido e j\u00e1 vamos preparar.";
  if (p.status === "preparando") return ola + "O seu pedido est\u00e1 sendo preparado.";
  if (p.status === "saiu_entrega") return ola + "O seu pedido saiu para entrega!";
  if (p.status === "pronto") return ola + "O seu pedido est\u00e1 pronto para retirada!";
  return ola + "Obrigado pelo pedido!";
}
function linkZap(p){
  let n = String(p.telefone || "").replace(/\D/g, "");
  if (n.length < 10) return null;
  if (n.length <= 11) n = "55" + n;
  return "https://wa.me/" + n + "?text=" + encodeURIComponent(msgZap(p));
}

function anterior(p){
  const ent = tipoDe(p) === "entrega";
  if (p.status === "preparando") return ["novo", "Voltar para Novo"];
  if (p.status === "saiu_entrega" || p.status === "pronto") return ["preparando", "Voltar para Preparando"];
  if (p.status === "entregue"){
    if (tipoDe(p) === "mesa") return ["preparando", "Voltar para Preparando"];
    return ent ? ["saiu_entrega", "Voltar para Saiu"] : ["pronto", "Voltar para Pronto"];
  }
  return null;
}
function miniAcoes(p){
  const w = document.createElement("div"); w.className = "mini";
  const ant = anterior(p);
  if (ant){
    const v = document.createElement("button"); v.type = "button"; v.textContent = "\u2190 " + ant[1];
    v.title = "Desfazer o \u00faltimo avan\u00e7o deste pedido";
    v.addEventListener("click", () => mudarStatus(p, ant[0], v));
    w.append(v);
  } else { w.append(document.createElement("span")); }
  const x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "Apagar"; x.title = "Apagar este pedido";
  x.addEventListener("click", async () => {
    const quem = p.nome ? " de " + p.nome : "";
    if (!confirm("Apagar o pedido" + quem + " (" + reais(p.total) + ")? Isso n\u00e3o pode ser desfeito.")) return;
    x.disabled = true;
    try{
      const {status, dados} = await api("saas-admin-apagar", {pedido_id: p.id});
      if (status === 401) return sair();
      if (!(status === 200 && dados && dados.ok)) throw new Error("falha");
      await atualizar();
    }catch(e){
      x.disabled = false; x.textContent = "Erro";
    }
  });
  w.append(x);
  return w;
}

function proximoDelivery(p){
  const ent = tipoDe(p) === "entrega";
  if (p.status === "novo") return ["preparando", "Come\u00e7ar a preparar"];
  if (p.status === "preparando") return ent ? ["saiu_entrega", "Saiu para entrega"] : ["pronto", "Pronto para retirar"];
  if (p.status === "saiu_entrega") return ["entregue", "Marcar como entregue"];
  if (p.status === "pronto") return ["entregue", "Marcar como retirado"];
  return null;
}

function cartaoDelivery(p, destaque){
  const ent = tipoDe(p) === "entrega";
  const d = document.createElement("div");
  d.className = "ped" + (destaque ? " destaque" : "");
  const cab = document.createElement("div"); cab.className = "cab";
  const tag = document.createElement("span"); tag.className = "tag" + (ent ? "" : " ret"); tag.textContent = ent ? "ENTREGA" : "RETIRADA";
  const hora = document.createElement("span"); hora.className = "hora";
  hora.textContent = new Date(p.criado_em).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
  cab.append(tag, hora); d.append(cab);

  const q = document.createElement("div"); q.className = "mesa"; q.style.fontSize = "1.1rem"; q.style.marginTop = "6px";
  q.textContent = p.nome || "(sem nome)"; d.append(q);
  if (p.telefone){ const t = document.createElement("div"); t.className = "tel"; t.textContent = p.telefone; d.append(t); }
  if (ent){
    const e = document.createElement("div"); e.className = "end";
    e.textContent = (p.endereco || "") + (p.bairro ? " - " + p.bairro : ""); d.append(e);
  }

  const ul = document.createElement("ul"); ul.className = "itens";
  for (const it of (Array.isArray(p.itens) ? p.itens : [])){
    const li = document.createElement("li"); li.textContent = it.qtd + "x " + it.nome; ul.append(li);
  }
  d.append(ul);
  if (p.observacoes){ const o = document.createElement("div"); o.className = "obs"; o.textContent = "Obs: " + p.observacoes; d.append(o); }

  const taxa = Number(p.taxa_entrega || 0);
  const t = document.createElement("div"); t.className = "tot";
  t.textContent = "Total " + reais(p.total) + (taxa > 0 ? " (com taxa de " + reais(taxa) + ")" : ""); d.append(t);

  const pg = document.createElement("div"); pg.className = "pag";
  pg.append(PAGAMENTOS[p.pagamento] || "Pagamento n\u00e3o informado");
  if (p.pagamento === "pix_antecipado"){
    const s = document.createElement("b"); s.className = p.pago_confirmado ? "ok" : "";
    s.textContent = p.pago_confirmado ? " \u00b7 pago" : " \u00b7 aguardando confirma\u00e7\u00e3o";
    pg.append(s);
  }
  if (p.pagamento === "dinheiro" && p.troco_para) pg.append(" \u00b7 troco para " + reais(p.troco_para));
  d.append(pg);

  if (p.pagamento === "pix_antecipado" && !p.pago_confirmado){
    const bp = document.createElement("button"); bp.className = "sec"; bp.textContent = "Confirmar Pix recebido";
    bp.addEventListener("click", async () => {
      if (!confirm("Confirmar que o Pix de " + reais(p.total) + " (" + (p.nome || "cliente") + ") caiu na sua conta?")) return;
      bp.disabled = true;
      try{
        const {status, dados} = await api("saas-admin-pago", {pedido_id: p.id});
        if (status === 401) return sair();
        if (!(status === 200 && dados && dados.ok)) throw new Error("falha");
        await atualizar();
      }catch(e){
        bp.disabled = false; bp.textContent = "Erro. Tente de novo";
      }
    });
    d.append(bp);
  }

  const prox = proximoDelivery(p);
  if (prox){
    const b = document.createElement("button"); b.textContent = prox[1];
    b.addEventListener("click", () => mudarStatus(p, prox[0], b));
    d.append(b);
  }
  const href = linkZap(p);
  if (href){
    const a = document.createElement("a"); a.className = "zap"; a.href = href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Avisar o cliente no WhatsApp"; d.append(a);
  }
  d.append(miniAcoes(p));
  return d;
}

function desenharDelivery(pedidos, novosIds){
  const col = {novo: [], preparando: [], saiu: [], entregue: []};
  for (const p of pedidos){
    const k = (p.status === "saiu_entrega" || p.status === "pronto") ? "saiu" : (col[p.status] ? p.status : "novo");
    col[k].push(p);
  }
  for (const s of ["novo", "preparando", "saiu", "entregue"]){
    const lista = s === "entregue" ? col[s].slice(0, 15) : col[s];
    const caixa = $("d-" + s);
    caixa.replaceChildren();
    if (!lista.length){
      const v = document.createElement("div"); v.className = "vazio"; v.textContent = "Nenhum pedido"; caixa.append(v);
    }
    for (const p of lista) caixa.append(cartaoDelivery(p, novosIds.has(p.id)));
    $("nd-" + s).textContent = col[s].length;
  }
  return col.novo.length;
}

function mostrarAba(nome){
  const del = nome === "delivery";
  $("vista-mesas").hidden = del;
  $("vista-delivery").hidden = !del;
  $("aba-mesas").classList.toggle("on", !del);
  $("aba-delivery").classList.toggle("on", del);
  try{ sessionStorage.setItem("aba", del ? "delivery" : "mesas"); }catch(e){}
}
$("aba-mesas").addEventListener("click", () => mostrarAba("mesas"));
$("aba-delivery").addEventListener("click", () => mostrarAba("delivery"));

function desenhar(todos, novosIds){
  const pedidos = todos.filter(p => tipoDe(p) === "mesa");
  const entregas = todos.filter(p => tipoDe(p) !== "mesa");
  const novosDel = desenharDelivery(entregas, novosIds);
  const col = {novo: [], preparando: [], entregue: []};
  for (const p of pedidos) (col[p.status] || col.novo).push(p);
  for (const s of ["novo", "preparando", "entregue"]){
    const lista = s === "entregue" ? col[s].slice(0, 15) : col[s];
    const caixa = $("c-" + s);
    caixa.replaceChildren();
    if (!lista.length){
      const v = document.createElement("div"); v.className = "vazio"; v.textContent = "Nenhum pedido"; caixa.append(v);
    }
    for (const p of lista) caixa.append(cartao(p, novosIds.has(p.id)));
    $("n-" + s).textContent = col[s].length;
  }
  const sel = $("f-mesa"), atual = sel.value;
  const mesas = [...new Set(pedidos.map(p => String(p.mesa)))].sort((a, b) => a.localeCompare(b, "pt-BR", {numeric: true}));
  sel.replaceChildren(...mesas.map(m => { const o = document.createElement("option"); o.value = m; o.textContent = ROT + " " + m; return o; }));
  if (mesas.includes(atual)) sel.value = atual;
  desenharContas(pedidos);
  $("b-mesas").textContent = col.novo.length;
  $("b-delivery").textContent = novosDel;
  $("b-mesas").classList.toggle("tem", col.novo.length > 0);
  $("b-delivery").classList.toggle("tem", novosDel > 0);
  const totalNovos = col.novo.length + novosDel;
  document.title = (totalNovos ? "(" + totalNovos + ") " : "") + "Pedidos";
}

function contasAbertas(pedidos){
  const mesas = new Map();
  for (const p of pedidos){
    if (p.paga || tipoDe(p) !== "mesa") continue;
    const m = String(p.mesa);
    if (!mesas.has(m)) mesas.set(m, new Map());
    const nome = p.nome || "";
    mesas.get(m).set(nome, (mesas.get(m).get(nome) || 0) + Number(p.total));
  }
  return mesas;
}

function desenharContas(pedidos){
  const caixa = $("contas");
  const mesas = contasAbertas(pedidos);
  caixa.replaceChildren();
  if (!mesas.size){
    const v = document.createElement("div"); v.className = "vazio"; v.textContent = "Nenhuma conta aberta"; caixa.append(v); return;
  }
  const ordem = [...mesas.keys()].sort((a, b) => a.localeCompare(b, "pt-BR", {numeric: true}));
  for (const m of ordem){
    const c = document.createElement("div"); c.className = "conta";
    const t = document.createElement("div"); t.className = "m"; t.textContent = ROT + " " + m; c.append(t);
    let soma = 0;
    for (const [nome, valor] of mesas.get(m)){
      soma += valor;
      const l = document.createElement("div"); l.className = "pessoa";
      const n = document.createElement("span"); n.textContent = nome || "(sem nome)";
      const v = document.createElement("span"); v.className = "v"; v.textContent = reais(valor);
      const dir = document.createElement("span"); dir.style.display = "flex"; dir.style.gap = "8px"; dir.style.alignItems = "center";
      dir.append(v);
      if (nome){
        const b = document.createElement("button"); b.textContent = "Fechar conta";
        b.addEventListener("click", () => fecharConta(m, nome, valor, b));
        dir.append(b);
      }
      l.append(n, dir); c.append(l);
    }
    const tm = document.createElement("div"); tm.className = "tm";
    const a = document.createElement("span"); a.textContent = "Total d" + fem() + " " + ROT.toLowerCase();
    const b2 = document.createElement("span"); b2.textContent = reais(soma);
    tm.append(a, b2); c.append(tm);
    caixa.append(c);
  }
}

async function fecharConta(mesa, nome, valor, btn){
  const st = $("c-st");
  if (!confirm("Fechar a conta de " + nome + " (" + ROT + " " + mesa + ")? Total " + reais(valor) + ".")) return;
  btn.disabled = true; st.className = "st"; st.textContent = "Fechando a conta de " + nome + "\u2026";
  try{
    const {status, dados} = await api("saas-admin-conta", {mesa, nome});
    if (status === 401) return sair();
    if (!(status === 200 && dados && dados.ok)) throw new Error("falha");
    st.className = "st ok"; st.textContent = "Conta de " + nome + " fechada (" + reais(valor) + ").";
    await atualizar();
  }catch(e){
    btn.disabled = false;
    st.className = "st erro"; st.textContent = "N\u00e3o foi poss\u00edvel fechar a conta. Tente de novo.";
  }
}

function aplicarRotulo(){
  $("t-aba").textContent = ROT + "s";
  $("t-fechar").textContent = "Fechar " + ROT.toLowerCase();
  $("f-btn").textContent = "Fechar " + ROT.toLowerCase();
  $("f-mesa").setAttribute("aria-label", ROT);
}
async function carregarRotulo(){
  try{
    const {status, dados} = await api("saas-admin-plano", {});
    if (status === 200 && dados && dados.rotulo_local){
      ROT = dados.rotulo_local;
      try{ sessionStorage.setItem("rot", ROT); }catch(e){}
    }
  }catch(e){}
  aplicarRotulo();
}
async function atualizar(){
  if (ocupado) return;
  ocupado = true;
  try{
    const {status, dados} = await api("saas-admin-pedidos", {});
    if (status === 401) return sair();
    if (status !== 200 || !dados) throw new Error("falha");
    const pedidos = dados.pedidos || [];
    ULTIMOS = pedidos;
    const ids = new Set(pedidos.map(p => p.id));
    const novosIds = new Set();
    if (conhecidos){
      for (const p of pedidos) if (!conhecidos.has(p.id)) novosIds.add(p.id);
    }
    const novosPedidos = pedidos.filter(p => novosIds.has(p.id) && p.status === "novo");
    conhecidos = ids;
    $("a-nome").textContent = dados.restaurante.nome;
    desenhar(pedidos, novosIds);
    if (novosPedidos.length) avisar(novosPedidos);
    $("a-pulso").className = "pulso";
    $("a-status").textContent = "Ao vivo \u00b7 atualizado \u00e0s " + new Date().toLocaleTimeString("pt-BR");
  }catch(e){
    $("a-pulso").className = "pulso off";
    $("a-status").textContent = "Sem conex\u00e3o. Tentando de novo\u2026";
  }finally{
    ocupado = false;
  }
}

$("f-btn").addEventListener("click", async () => {
  const mesa = $("f-mesa").value, st = $("f-st"), btn = $("f-btn");
  if (!mesa) { st.className = "st erro"; st.textContent = "Nenhum" + (fem()==="a" ? "a " : " ") + ROT.toLowerCase() + " na lista."; return; }
  const abertas = contasAbertas(ULTIMOS).get(String(mesa)) || new Map();
  let soma = 0; for (const v of abertas.values()) soma += v;
  const aviso = abertas.size ? " Total em aberto: " + reais(soma) + " (" + abertas.size + (abertas.size === 1 ? " conta)." : " contas).") : "";
  if (!confirm("Fechar " + (fem()==="o" ? "o " : "a ") + ROT + " " + mesa + "?" + aviso + " O celular dos clientes deixa de aceitar pedidos.")) return;
  btn.disabled = true; st.className = "st"; st.textContent = "Fechando\u2026";
  try{
    for (const nome of abertas.keys()){
      if (!nome) continue;
      const rc = await api("saas-admin-conta", {mesa, nome});
      if (rc.status === 401) return sair();
      if (!(rc.status === 200 && rc.dados && rc.dados.ok)) throw new Error("falha");
    }
    const {status, dados} = await api("saas-admin-fechar", {mesa});
    if (status === 401) return sair();
    if (!(status === 200 && dados && dados.ok)) throw new Error("falha");
    st.className = "st ok";
    st.textContent = dados.atualizado ? ROT + " " + mesa + " fechad" + fem() + "." : ROT + " " + mesa + " j\u00e1 estava fechad" + fem() + ".";
    await atualizar();
  }catch(e){
    st.className = "st erro"; st.textContent = "N\u00e3o foi poss\u00edvel fechar. Tente de novo.";
  }finally{
    btn.disabled = false;
  }
});

async function manterTelaLigada(){
  try{ if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && timer) { manterTelaLigada(); atualizar(); } });

function sair(){
  clearInterval(timer); timer = null; conhecidos = null;
  try{ sessionStorage.removeItem("chave"); }catch(e){}
  try{ if (wake) wake.release(); }catch(e){}
  CHAVE = "";
  $("app").hidden = true; $("login").hidden = false; $("l-chave").value = "";
  $("l-st").className = "st erro"; $("l-st").textContent = "Acesso negado. Confira o restaurante e a chave.";
}

async function entrar(){
  const st = $("l-st"), btn = $("l-entrar");
  REST = limpaSlug($("l-rest").value);
  CHAVE = $("l-chave").value.trim();
  if (!REST || !CHAVE){ st.className = "st erro"; st.textContent = "Preencha os dois campos."; return; }
  btn.disabled = true; st.className = "st"; st.textContent = "Entrando\u2026";
  try{
    if (!ctx){ try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    try{ if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }catch(e){}
    const {status, dados} = await api("saas-admin-pedidos", {});
    if (status === 401){ st.className = "st erro"; st.textContent = "Acesso negado. Confira o restaurante e a chave."; return; }
    if (status !== 200 || !dados) throw new Error("falha");
    try{ sessionStorage.setItem("rest", REST); sessionStorage.setItem("chave", CHAVE); }catch(e){}
    $("login").hidden = true; $("app").hidden = false; st.textContent = "";
    conhecidos = null;
    await carregarRotulo();
    try{ mostrarAba(sessionStorage.getItem("aba") === "delivery" ? "delivery" : "mesas"); }catch(e){}
    await atualizar();
    clearInterval(timer);
    timer = setInterval(atualizar, INTERVALO_MS);
    manterTelaLigada();
  }catch(e){
    st.className = "st erro"; st.textContent = "N\u00e3o foi poss\u00edvel conectar. Tente de novo.";
  }finally{
    btn.disabled = false;
  }
}

$("l-entrar").addEventListener("click", entrar);
$("l-chave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("a-sair").addEventListener("click", () => { sair(); $("l-st").textContent = ""; });
$("a-som").addEventListener("click", () => {
  somLigado = !somLigado;
  $("a-som").textContent = "Som: " + (somLigado ? "ligado" : "desligado");
  if (somLigado) bip();
});

$("l-rest").value = limpaSlug(new URLSearchParams(location.search).get("r")) || (() => { try{ return sessionStorage.getItem("rest") || ""; }catch(e){ return ""; } })();
try{
  const c = sessionStorage.getItem("chave");
  if (c && $("l-rest").value){ $("l-chave").value = c; }
}catch(e){}
</script>
</body>
