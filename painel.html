<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel do card&#225;pio</title>
<style>
:root{color-scheme:dark;--bg:#0d0b0c;--ink:#f4efe8;--muted:#b0a7a0;--line:#4a2f31;--accent:#ff4a3d;--ok:#4cc38a;--surface:#171112}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:900px;margin:0 auto;padding:24px 16px 80px}
h1{margin:0 0 4px;font-size:1.6rem}
h2{margin:28px 0 10px;font-size:1.1rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.sub{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}
input,textarea{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid,.grid3{grid-template-columns:1fr}}
.rodape{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:.95rem}
.chk input{width:20px;height:20px;margin:0}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
.st{font-size:.9rem;min-height:1.2em}
.st.ok{color:var(--ok)}
.st.erro{color:var(--accent)}
.off{opacity:.6}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
[hidden]{display:none!important}
a.voltar{display:inline-block;padding:10px 16px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font:inherit;font-weight:600;background:transparent}
a.voltar:hover{border-color:var(--accent)}
a.voltar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <section id="login" class="card">
    <h1>Painel do card&#225;pio</h1>
    <p class="sub">Entre para editar itens e pre&#231;os.</p>
    <label>Restaurante (endere&#231;o do bar)<input id="l-rest" autocapitalize="none" autocomplete="off" placeholder="ex.: pizzahug"></label>
    <label>Chave de acesso<input id="l-chave" type="password" autocomplete="off"></label>
    <div class="rodape"><span id="l-st" class="st" role="status"></span><button id="l-entrar">Entrar</button></div>
  </section>

  <section id="app" hidden>
    <div class="topo">
      <div><h1 id="a-nome"></h1><p class="sub">Mudou o pre&#231;o? Edite e toque em Salvar no item.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="voltar" href="app.html">&larr; Menu</a><button class="sec" id="a-sair">Sair</button></div>
    </div>

    <h2>Novo item</h2>
    <div class="card" id="novo"></div>

    <div id="lista"></div>
  </section>
</main>
<datalist id="cats"></datalist>
<script>
const URL_BASE = "https://n8n.automatikai.cloud/webhook/";
const $ = id => document.getElementById(id);
let REST = "", CHAVE = "";

const limpaSlug = v => String(v || "").replace(/[^0-9a-z-]/gi, "").toLowerCase().slice(0, 40);

async function api(caminho, corpo){
  const r = await fetch(URL_BASE + caminho, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({r: REST, chave: CHAVE, ...corpo})
  });
  let dados = null;
  try{ dados = await r.json(); }catch(e){}
  return {status: r.status, dados};
}

function campo(rotulo, el){
  const l = document.createElement("label");
  l.append(rotulo, el);
  return l;
}
function input(tipo, valor, extra){
  const i = document.createElement("input");
  i.type = tipo; i.value = valor ?? "";
  Object.assign(i, extra || {});
  return i;
}

// Monta o formul\u00e1rio de um item (existente ou novo)
function formItem(item, aoSalvar, textoBotao){
  const box = document.createElement("div");
  const nome = input("text", item.nome, {maxLength: 80});
  const preco = input("text", item.preco != null ? String(item.preco).replace(".", ",") : "", {inputMode: "decimal", placeholder: "0,00"});
  const desc = input("text", item.descricao, {maxLength: 200});
  const cat = input("text", item.categoria, {maxLength: 40});
  cat.setAttribute("list", "cats");

  const g = document.createElement("div"); g.className = "grid";
  g.append(campo("Nome", nome), campo("Pre\u00e7o (R$)", preco));
  const g2 = document.createElement("div"); g2.className = "grid3";
  g2.append(campo("Descri\u00e7\u00e3o", desc), campo("Categoria", cat));
  box.append(g, g2);

  const rod = document.createElement("div"); rod.className = "rodape";
  let disp = null;
  if (item.id){
    const l = document.createElement("label"); l.className = "chk";
    disp = input("checkbox", ""); disp.checked = !!item.disponivel;
    l.append(disp, "Dispon\u00edvel no card\u00e1pio");
    l.addEventListener("change", () => box.classList.toggle("off", !disp.checked));
    rod.append(l);
    box.classList.toggle("off", !item.disponivel);
  } else {
    rod.append(document.createElement("span"));
  }
  const st = document.createElement("span"); st.className = "st"; st.setAttribute("role", "status");
  const btn = document.createElement("button"); btn.textContent = textoBotao;
  const dir = document.createElement("div"); dir.style.display = "flex"; dir.style.gap = "12px"; dir.style.alignItems = "center";
  dir.append(st, btn); rod.append(dir); box.append(rod);

  btn.addEventListener("click", async () => {
    const p = Number(String(preco.value).replace(",", "."));
    if (nome.value.trim().length < 2){ st.className = "st erro"; st.textContent = "Digite o nome."; return; }
    if (!cat.value.trim()){ st.className = "st erro"; st.textContent = "Digite a categoria."; return; }
    if (!Number.isFinite(p) || p < 0){ st.className = "st erro"; st.textContent = "Pre\u00e7o inv\u00e1lido."; return; }
    btn.disabled = true; st.className = "st"; st.textContent = "Salvando\u2026";
    try{
      const dados = {
        id: item.id, nome: nome.value, descricao: desc.value,
        categoria: cat.value, preco: p, disponivel: disp ? disp.checked : true
      };
      const ok = await aoSalvar(dados);
      st.className = ok ? "st ok" : "st erro";
      st.textContent = ok ? "Salvo!" : "N\u00e3o foi poss\u00edvel salvar.";
    }catch(e){
      st.className = "st erro"; st.textContent = "Sem conex\u00e3o. Tente de novo.";
    }finally{
      btn.disabled = false;
    }
  });
  return box;
}

function desenhar(itens){
  const grupos = new Map();
  for (const it of itens){
    const c = it.categoria || "sem categoria";
    if (!grupos.has(c)) grupos.set(c, []);
    grupos.get(c).push(it);
  }
  $("cats").replaceChildren(...[...grupos.keys()].map(c => { const o = document.createElement("option"); o.value = c; return o; }));

  const lista = $("lista"); lista.replaceChildren();
  for (const [cat, its] of grupos){
    const h = document.createElement("h2"); h.textContent = cat;
    lista.append(h);
    for (const it of its){
      const card = document.createElement("div"); card.className = "card";
      card.append(formItem(it, async d => {
        const {status, dados} = await api("saas-admin-salvar", {item: d});
        if (status === 401) { sair(); return false; }
        return status === 200 && dados && dados.ok;
      }, "Salvar"));
      lista.append(card);
    }
  }

  const novo = $("novo"); novo.replaceChildren();
  novo.append(formItem({}, async d => {
    const {status, dados} = await api("saas-admin-novo", {item: d});
    if (status === 401) { sair(); return false; }
    if (status === 200 && dados && dados.ok){ await carregar(); return true; }
    return false;
  }, "Adicionar"));
}

async function carregar(){
  const {status, dados} = await api("saas-admin-listar", {});
  if (status === 401) throw new Error("negado");
  if (status !== 200 || !dados) throw new Error("falha");
  $("a-nome").textContent = dados.restaurante.nome;
  desenhar(dados.itens || []);
}

function sair(){
  try{ sessionStorage.removeItem("chave"); }catch(e){}
  CHAVE = "";
  $("app").hidden = true; $("login").hidden = false;
  $("l-chave").value = "";
  $("l-st").className = "st erro"; $("l-st").textContent = "Acesso negado. Confira o restaurante e a chave.";
}

async function entrar(){
  const st = $("l-st"), btn = $("l-entrar");
  REST = limpaSlug($("l-rest").value);
  CHAVE = $("l-chave").value.trim();
  if (!REST || !CHAVE){ st.className = "st erro"; st.textContent = "Preencha os dois campos."; return; }
  btn.disabled = true; st.className = "st"; st.textContent = "Entrando\u2026";
  try{
    await carregar();
    try{ sessionStorage.setItem("rest", REST); sessionStorage.setItem("chave", CHAVE); }catch(e){}
    $("login").hidden = true; $("app").hidden = false; st.textContent = "";
  }catch(e){
    st.className = "st erro";
    st.textContent = e.message === "negado" ? "Acesso negado. Confira o restaurante e a chave." : "N\u00e3o foi poss\u00edvel conectar. Tente de novo.";
  }finally{
    btn.disabled = false;
  }
}

$("l-entrar").addEventListener("click", entrar);
$("l-chave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("a-sair").addEventListener("click", () => { sair(); $("l-st").textContent = ""; });

// Restaurante vem do link (?r=pizzahug) ou da \u00faltima sess\u00e3o desta aba
$("l-rest").value = limpaSlug(new URLSearchParams(location.search).get("r")) || (() => { try{ return sessionStorage.getItem("rest") || ""; }catch(e){ return ""; } })();
try{
  const c = sessionStorage.getItem("chave");
  if (c && $("l-rest").value){ $("l-chave").value = c; entrar(); }
}catch(e){}
</script>
</body>
</html>
